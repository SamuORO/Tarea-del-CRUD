<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRUD de Productos</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

    <div class="container mt-5">

        <h1 class="text-center mb-4">
            CRUD de Productos
        </h1>

        <!-- FORMULARIO -->
        <div class="card shadow mb-4">

            <div class="card-header bg-primary text-white">
                Registro de productos
            </div>

            <div class="card-body">

                <form id="FormularioProducto">

                    <!-- ID oculto para editar -->
                    <input
                        type="hidden"
                        name="Id"
                        id="Id"
                    >

                    <div class="row">

                        <!-- Código -->
                        <div class="col-md-6 mb-3">

                            <label for="Codigo" class="form-label">
                                Código
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="Codigo"
                                id="Codigo"
                                maxlength="20"
                                required
                            >

                        </div>

                        <!-- Producto -->
                        <div class="col-md-6 mb-3">

                            <label for="Producto" class="form-label">
                                Producto
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="Producto"
                                id="Producto"
                                maxlength="100"
                                required
                            >

                        </div>

                        <!-- Precio -->
                        <div class="col-md-6 mb-3">

                            <label for="Precio" class="form-label">
                                Precio
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                name="Precio"
                                id="Precio"
                                min="0"
                                step="0.01"
                                required
                            >

                        </div>

                        <!-- Cantidad -->
                        <div class="col-md-6 mb-3">

                            <label for="Cantidad" class="form-label">
                                Cantidad
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                name="Cantidad"
                                id="Cantidad"
                                min="0"
                                step="1"
                                required
                            >

                        </div>

                    </div>

                    <!-- Botones -->
                    <div class="d-flex gap-2">

                        <button
                            type="button"
                            class="btn btn-success"
                            id="btnGuardar"
                        >
                            Guardar
                        </button>

                        <button
                            type="button"
                            class="btn btn-warning"
                            id="btnActualizar"
                            disabled
                        >
                            Actualizar
                        </button>

                        <button
                            type="reset"
                            class="btn btn-secondary"
                            id="btnLimpiar"
                        >
                            Limpiar
                        </button>

                    </div>

                </form>

            </div>

        </div>


        <!-- BÚSQUEDA -->
        <div class="card shadow mb-4">

            <div class="card-body">

                <label for="Buscar" class="form-label">
                    Buscar producto
                </label>

                <div class="input-group">

                    <input
                        type="text"
                        class="form-control"
                        id="Buscar"
                        placeholder="Código o nombre del producto"
                    >

                    <button
                        class="btn btn-primary"
                        type="button"
                        id="btnBuscar"
                    >
                        Buscar
                    </button>

                </div>

            </div>

        </div>


        <!-- TABLA -->
        <div class="card shadow">

            <div class="card-header bg-dark text-white">
                Productos registrados
            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-striped table-hover">

                        <thead class="table-dark">

                            <tr>
                                <th>ID</th>
                                <th>Código</th>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th>Cantidad</th>
                                <th>Acciones</th>
                            </tr>

                        </thead>

                        <tbody id="TablaProductos">

                            <tr>
                                <td colspan="6" class="text-center">
                                    Cargando productos...
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>


    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- JavaScript del proyecto -->
    <script src="script.js"></script>

</body>

</html>
